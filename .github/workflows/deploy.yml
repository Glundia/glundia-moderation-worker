name: Build and Deploy Moderation Worker

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGION: us-central1
  SERVICE_NAME: moderation-worker
  AR_REPO: glundia-moderation-worker

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: sha
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "image-tag=develop-${{ steps.sha.outputs.sha }}" >> $GITHUB_OUTPUT
          else
            echo "image-tag=latest" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Authenticate to Google Cloud (DEV)
        if: github.ref == 'refs/heads/develop'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}
          token_format: access_token

      - name: Authenticate to Google Cloud (PROD)
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}
          token_format: access_token

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image (DEV)
        id: build-dev
        if: github.ref == 'refs/heads/develop'
        run: |
          PROJECT_ID=${{ secrets.GCP_PROJECT_ID_DEV }}
          docker build -t ${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.tag.outputs.image-tag }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.tag.outputs.image-tag }}

      - name: Build and push Docker image (PROD)
        id: build-prod
        if: github.ref == 'refs/heads/main'
        run: |
          PROJECT_ID=${{ secrets.GCP_PROJECT_ID_PROD }}
          docker build -t ${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.tag.outputs.image-tag }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.tag.outputs.image-tag }}

  deploy-dev:
    name: Deploy to DEV
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: dev
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Deploy to Cloud Run (DEV)
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_DEV }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ needs.build.outputs.image-tag }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$IMAGE" \
            --project=${{ secrets.GCP_PROJECT_ID_DEV }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=moderation-worker@${{ secrets.GCP_PROJECT_ID_DEV }}.iam.gserviceaccount.com \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300 \
            --set-env-vars=GCP_PROJECT=${{ secrets.GCP_PROJECT_ID_DEV }},ENVIRONMENT=dev,PUBSUB_SUBSCRIPTION=moderation-worker-sub,QUARANTINE_BUCKET=${{ secrets.GCP_PROJECT_ID_DEV }}-uploads-quarantine,PUBLIC_BUCKET=${{ secrets.GCP_PROJECT_ID_DEV }}-images-public,REJECTED_BUCKET=${{ secrets.GCP_PROJECT_ID_DEV }}-images-rejected \
            --update-secrets=DATABASE_URL=database-url:latest

  deploy-prod:
    name: Deploy to PROD
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: prod
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}

      - name: Deploy to Cloud Run (PROD)
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ needs.build.outputs.image-tag }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$IMAGE" \
            --project=${{ secrets.GCP_PROJECT_ID_PROD }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=moderation-worker@${{ secrets.GCP_PROJECT_ID_PROD }}.iam.gserviceaccount.com \
            --memory=1Gi \
            --cpu=2 \
            --min-instances=1 \
            --max-instances=100 \
            --timeout=300 \
            --set-env-vars=GCP_PROJECT=${{ secrets.GCP_PROJECT_ID_PROD }},ENVIRONMENT=prod,PUBSUB_SUBSCRIPTION=moderation-worker-sub,QUARANTINE_BUCKET=${{ secrets.GCP_PROJECT_ID_PROD }}-uploads-quarantine,PUBLIC_BUCKET=${{ secrets.GCP_PROJECT_ID_PROD }}-images-public,REJECTED_BUCKET=${{ secrets.GCP_PROJECT_ID_PROD }}-images-rejected \
            --update-secrets=DATABASE_URL=database-url:latest

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          pytest tests/unit/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
